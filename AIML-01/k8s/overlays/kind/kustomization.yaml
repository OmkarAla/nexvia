apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: nexvia-fraud
    newName: nexvia-fraud
    newTag: dev
  - name: nexvia-fraud-dashboard
    newName: nexvia-fraud-dashboard
    newTag: dev

patches:
  - target:
      kind: Deployment
      name: dashboard
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
