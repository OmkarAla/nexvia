apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: feast-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: feast-materialize
  labels: {app: feast-materialize}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app: feast-materialize}
    spec:
      restartPolicy: Never
      containers:
        - name: feast-materialize
          image: nexvia-fraud:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/feast_materialize.py"]
          envFrom:
            - configMapRef: {name: nexvia-config}
          volumeMounts:
            - {name: feast-data, mountPath: /app/data/feast}
      volumes:
        - name: feast-data
          persistentVolumeClaim: {claimName: feast-data}
