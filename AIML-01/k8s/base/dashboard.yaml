apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: {app: dashboard}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dashboard}
  template:
    metadata:
      labels: {app: dashboard}
    spec:
      containers:
        - name: dashboard
          image: nexvia-fraud-dashboard:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          readinessProbe:
            tcpSocket: {port: 80}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "128Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector: {app: dashboard}
  ports: [{port: 80, targetPort: 80}]
