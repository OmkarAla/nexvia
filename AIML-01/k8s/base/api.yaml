apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U nexvia -d nexvia; do sleep 2; done"]
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
      containers:
        - name: api
          image: nexvia-fraud:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "nexvia_fraud.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: nexvia-config}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: "250m", memory: "384Mi"}
            limits: {cpu: "1", memory: "768Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
