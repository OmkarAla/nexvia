apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels: {app: consumer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: consumer}
  template:
    metadata:
      labels: {app: consumer}
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do sleep 2; done"]
      containers:
        - name: consumer
          image: nexvia-fraud:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "nexvia_fraud.streaming.worker"]
          envFrom:
            - configMapRef: {name: nexvia-config}
          volumeMounts:
            - {name: feast-data, mountPath: /app/data/feast}
          resources:
            requests: {cpu: "250m", memory: "384Mi"}
            limits: {cpu: "1", memory: "1Gi"}
      volumes:
        - name: feast-data
          persistentVolumeClaim: {claimName: feast-data}
