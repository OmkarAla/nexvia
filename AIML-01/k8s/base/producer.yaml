apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels: {app: producer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: producer}
  template:
    metadata:
      labels: {app: producer}
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do sleep 2; done"]
      containers:
        - name: producer
          image: nexvia-fraud:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/replay.py", "--rate", "2", "--loop"]
          envFrom:
            - configMapRef: {name: nexvia-config}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
