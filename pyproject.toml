[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvia-fraud"
version = "0.1.0"
description = "Real-time fraud scoring and case review - education project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.2",
  "xgboost>=2.1",
  "pandas>=2.2,<3",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pyarrow>=17",
  "confluent-kafka>=2.5",
  "evidently>=0.7.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires real Kafka/Postgres"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
