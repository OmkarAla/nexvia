name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -m "not integration" -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: docker compose up -d postgres kafka
      - name: Wait for Kafka
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T kafka kafka-topics.sh --bootstrap-server localhost:9092 --list && exit 0
            sleep 2
          done
          exit 1
      - name: Integration tests
        env:
          KAFKA_BOOTSTRAP: localhost:9094
          DATABASE_URL: postgresql+psycopg://nexvia:nexvia@localhost:5432/nexvia
        run: |
          docker compose up -d postgres
          python -m pytest -m integration -q
