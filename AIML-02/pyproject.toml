[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvia-imaging"
version = "0.1.0"
description = "AI-assisted medical imaging review - education project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydicom>=3.0",
  "Pillow>=10",
  "numpy>=1.26",
  "httpx>=0.27",
  "torch>=2.4",
  "torchvision>=0.19",
  "scikit-learn>=1.5",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "training"]
testpaths = ["tests"]
markers = ["integration: requires Orthanc/Postgres", "model: requires torch weights"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
