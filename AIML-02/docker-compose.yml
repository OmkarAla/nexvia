services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexvia
      POSTGRES_PASSWORD: nexvia
      POSTGRES_DB: nexvia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexvia -d nexvia"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  orthanc:
    image: orthancteam/orthanc:26.11.0
    ports:
      - "8042:8042"
      - "4242:4242"
    environment:
      ORTHANC__NAME: nexvia
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: /dicom-web/
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__STORAGE_DIRECTORY: /var/lib/orthanc/db
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8042/system"]
      interval: 5s
      timeout: 5s
      retries: 20

  seed:
    build: .
    command: python scripts/upload_dicoms.py --url http://orthanc:8042
    environment: &imaging_env
      DATABASE_URL: postgresql+psycopg://nexvia:nexvia@postgres:5432/nexvia
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: orthanc
      ORTHANC_PASSWORD: orthanc
      DEMO_DATA_DIR: data/demo
      MODEL_DIR: artifacts/demo
      POLL_INTERVAL_SECONDS: "5"
    depends_on:
      orthanc:
        condition: service_healthy

  api:
    build: .
    command: uvicorn nexvia_imaging.api.app:app --host 0.0.0.0 --port 8000
    environment: *imaging_env
    ports:
      - "8000:8000"
    volumes:
      - overlays-data:/app/data/overlays
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    command: python -m nexvia_imaging.worker.runner
    environment: *imaging_env
    volumes:
      - overlays-data:/app/data/overlays
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
  orthanc-data:
  overlays-data:
