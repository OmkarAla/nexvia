services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexvia
      POSTGRES_PASSWORD: nexvia
      POSTGRES_DB: nexvia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexvia -d nexvia"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Reserved for the Feast online store in the depth phase.
  redis:
    image: redis:7-alpine

  seed:
    build: .
    command: python scripts/seed.py --limit 600
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://nexvia:nexvia@postgres:5432/nexvia
      KAFKA_BOOTSTRAP: kafka:9092
      MODEL_DIR: artifacts/demo
      DEMO_DATA_PATH: data/demo/transactions.csv
      ALERT_THRESHOLD: "0.5"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn nexvia_fraud.api.app:app --host 0.0.0.0 --port 8000
    environment: *app_env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  consumer:
    build: .
    command: python -m nexvia_fraud.streaming.worker
    restart: on-failure
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  producer:
    build: .
    command: python scripts/replay.py --rate 2 --loop
    environment: *app_env
    depends_on:
      kafka:
        condition: service_healthy
      consumer:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
